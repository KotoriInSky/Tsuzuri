<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>快递徽标预览</title>
<style>
  :root {
    --page: #050505;
    --card: #111111;
    --text: #F2F2F2;
    --muted: #8E8E93;
    --line: #232323;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px;
    background: var(--page); color: var(--text);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  main { max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 32px 0 12px; color: var(--muted); font-weight: 600; }
  p.note { color: var(--muted); font-size: 13px; margin: 0; line-height: 1.6; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 16px; }
  .tile { background: var(--card); border-radius: 20px; padding: 16px; text-align: center; border: 1px solid var(--line); }
  .tile svg { width: 100%; max-width: 224px; height: auto; display: block; margin: 0 auto; }
  .tile .name { margin-top: 10px; font-size: 14px; font-weight: 600; }
  .tile .meta { font-size: 12px; color: var(--muted); margin-top: 2px; font-family: ui-monospace, Consolas, monospace; }
  .row { background: var(--card); border-radius: 20px; padding: 16px; display: flex; flex-wrap: wrap; gap: 12px; border: 1px solid var(--line); }
  .row svg { width: 56px; height: 56px; display: block; }
  .islands { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .island { background: var(--card); border-radius: 28px; padding: 14px 18px 14px 14px; display: flex; align-items: center; gap: 14px; border: 1px solid var(--line); }
  .cover { position: relative; width: 56px; height: 56px; flex: none; }
  .cover svg { width: 56px; height: 56px; display: block; }
  .cover .app {
    position: absolute; top: -5px; right: -5px; width: 20px; height: 20px; border-radius: 6px;
    background: #3A3A3C; border: 2px solid var(--card); color: #D1D1D6;
    font-size: 8px; line-height: 16px; text-align: center; font-weight: 700;
  }
  .island .t { font-size: 17px; font-weight: 700; }
  .island .s { font-size: 13px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; margin-top: 3px; }
</style>
</head>
<body>
<main>
  <h1>快递岛 · 承运商自绘徽标</h1>
  <p class="note">
    与 <code>hook/.../ExpressBadgePainter.kt</code> 按同一份几何数据绘制（下面脚本里 SPEC 段由
    <code>core</code> 单测逐字核对）。方图 224px，扁平风格（纯色底、无渐变投影），圆角 = 宽 × 0.25；底色接近黑（#111），模拟超级岛展开态。
    右上角灰色小标是「负责打开的 App」占位，不是徽标的一部分。
  </p>

  <h2>224px 原尺寸</h2>
  <div class="grid" id="big"></div>

  <h2>56px（岛上实际显示大小）</h2>
  <div class="row" id="small"></div>

  <h2>岛上效果</h2>
  <div class="islands" id="islands"></div>
</main>

function el(name, attrs, kids) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (kids || []).forEach(k => e.appendChild(k));
  return e;
}

// 一个部件 → SVG 元素（坐标在 24 网格里，外层 group 负责放大）
function markEl(m, color) {
  let e;
  if (m.k === "p") e = el("path", { d: m.d });
  else if (m.k === "c") e = el("circle", { cx: m.cx, cy: m.cy, r: m.r });
  else e = el("rect", { x: m.x, y: m.y, width: m.w, height: m.h, rx: m.rx, ry: m.rx });
  e.setAttribute("fill", m.fill ? color : "none");
  if (m.sw > 0) {
    e.setAttribute("stroke", color);
    e.setAttribute("stroke-width", m.sw);
    e.setAttribute("stroke-linecap", "round");
    e.setAttribute("stroke-linejoin", "round");
  }
  if (m.dot > 0) e.setAttribute("stroke-dasharray", SPEC.style.DOT_ON + " " + m.dot);
  if (m.a < 1) e.setAttribute("opacity", m.a);
  return e;
}

// 按顺序画部件；CUT 擦掉它**之前**画过的内容（= Android 的 DST_OUT），用嵌套 mask 实现
function glyphGroup(badge, defs, p) {
  let content = el("g", {});
  for (const m of SPEC.glyphs[badge.glyph]) {
    if (m.role === "CUT") {
      const id = p + "m" + (uid++);
      const cut = markEl(m, "#000");
      cut.removeAttribute("opacity");
      defs.appendChild(el("mask", { id, maskUnits: "userSpaceOnUse", x: -4, y: -4, width: 32, height: 32 }, [
        el("rect", { x: -4, y: -4, width: 32, height: 32, fill: "#fff" }), cut,
      ]));
      // 外面再包一层不带 mask 的 g：后面的部件画在 mask 之外，不会被这次镂空擦掉
      content = el("g", {}, [el("g", { mask: "url(#" + id + ")" }, [content])]);
    } else {
      content.appendChild(markEl(m, m.role === "ACCENT" ? badge.accent : badge.fg));
    }
  }
  const st = SPEC.style;
  const k = S * st.GLYPH_SPAN / st.GRID, off = S * (1 - st.GLYPH_SPAN) / 2;
  return el("g", { transform: "translate(" + off + " " + off + ") scale(" + k + ")" }, [content]);
}

// 扁平风格：纯色圆角底 + 图形，没有渐变 / 投影 / 高光 / 描边（与 ExpressBadgePainter 一致）
function badgeSvg(badge) {
  const st = SPEC.style, p = "b" + (uid++) + "_";
  const defs = el("defs", {});
  const glyph = glyphGroup(badge, defs, p);
  const R = S * st.CORNER;
  return el("svg", { viewBox: "0 0 " + S + " " + S, role: "img", "aria-label": badge.carrier }, [
    defs,
    el("rect", { width: S, height: S, rx: R, ry: R, fill: badge.bg }),
    glyph,
  ]);
}

const unique = SPEC.badges.filter(b => {
  const key = b.glyph + b.bg;
  if (seen.has(key)) return false;
  seen.add(key); return true;
});
const big = document.getElementById("big"), small = document.getElementById("small"), isl = document.getElementById("islands");
for (const b of unique) {
  const posts = SPEC.badges.filter(x => x.glyph === b.glyph && x.bg === b.bg).map(x => x.carrier);
  const tile = document.createElement("div"); tile.className = "tile";
  tile.appendChild(badgeSvg(b));
  tile.insertAdjacentHTML("beforeend", '<div class="name"></div><div class="meta"></div>');
  tile.querySelector(".name").textContent = posts.join(" / ");
  tile.querySelector(".meta").textContent = b.glyph + "  " + b.bg + " · " + b.fg + " · " + b.accent;
  big.appendChild(tile);
  small.appendChild(badgeSvg(b));
}
for (const b of SPEC.badges) {
  const card = document.createElement("div"); card.className = "island";
  card.innerHTML = '<div class="cover"><span class="app">App</span></div><div><div class="t"></div><div class="s"></div></div>';
  card.querySelector(".cover").prepend(badgeSvg(b));
  card.querySelector(".t").textContent = b.carrier === "通用" ? "快递" : b.carrier;
  card.querySelector(".s").textContent = SAMPLES[b.carrier] || "";
  isl.appendChild(card);
}
</script>
</body>
</html>
