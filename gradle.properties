# Appindex 那两次编译 OOM 的教训：必须显式设堆，别用默认值
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ---------------------------------------------------------------------------
# 发布签名（可选）
#
# 三样齐全**且** keystore 文件存在时，release 用它签名；缺任何一样都会回落到
# debug 签名并打印一条 warning —— 不配也能构建，只是产物不能对外分发。
# 也可以改用环境变量：FP_KEYSTORE_PATH / FP_KEYSTORE_ALIAS / FP_KEYSTORE_PASSWORD。
#
# ⚠️ 本文件是入库的。**不要把真实密码写在这里提交**：请把下面三行写进用户级
#    ~/.gradle/gradle.properties（不随仓库走），或使用环境变量。
#    仓库里不放任何 keystore；*.jks / *.keystore / *.p12 已被 .gitignore 排除。
# ---------------------------------------------------------------------------
# fp.keystore.path=C:/keys/tsuzuri-release.jks
# fp.keystore.alias=tsuzuri
# fp.keystore.password=改成自己的口令
